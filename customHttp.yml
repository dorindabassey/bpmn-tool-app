customHeaders:
  - pattern: "**" # Applies to all files
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://miro.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://miro.com; connect-src 'self' https://miro.com; frame-ancestors 'self' https://miro.com;"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: X-Frame-Options
        value: "SAMEORIGIN"
      - key: X-XSS-Protection
        value: "1; mode=block"
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - key: Referrer-Policy
        value: "no-referrer-when-downgrade"
      - key: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=(), fullscreen=(self), payment=(), usb=()"
